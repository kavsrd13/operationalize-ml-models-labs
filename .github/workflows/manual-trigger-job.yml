name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Determine Azure auth mode
      id: auth_mode
      env:
        AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        set -euo pipefail
        if [ -n "${AZURE_CREDENTIALS:-}" ]; then
          echo "mode=sp" >> "$GITHUB_OUTPUT"
        elif [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ] && [ -n "${AZURE_SUBSCRIPTION_ID:-}" ]; then
          echo "mode=oidc" >> "$GITHUB_OUTPUT"
        else
          echo "mode=missing" >> "$GITHUB_OUTPUT"
        fi
    - name: Azure login (service principal secret)
      if: ${{ steps.auth_mode.outputs.mode == 'sp' }}
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Azure login (OIDC)
      if: ${{ steps.auth_mode.outputs.mode == 'oidc' }}
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Validate Azure ML configuration
      env:
        RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        WS: ${{ vars.AZURE_WORKSPACE_NAME || vars.AZURE_ML_WORKSPACE }}
        COMPUTE: ${{ vars.AZURE_ML_COMPUTE }}
        AUTH_MODE: ${{ steps.auth_mode.outputs.mode }}
      run: |
        set -euo pipefail
        trim_value() {
          local value="${1:-}"
          value="${value//$'\r'/}"
          value="${value//$'\n'/}"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          printf '%s' "$value"
        }
        RG="$(trim_value "${RG:-}")"
        WS="$(trim_value "${WS:-}")"
        COMPUTE_NAME="$(trim_value "${COMPUTE:-course-cpu}")"
        if [ -z "$RG" ]; then
          echo "Missing repository variable: AZURE_RESOURCE_GROUP"
          exit 1
        fi
        if [ -z "$WS" ]; then
          echo "Missing repository variable: AZURE_WORKSPACE_NAME (or AZURE_ML_WORKSPACE)"
          exit 1
        fi
        if [ "${AUTH_MODE:-missing}" = "missing" ]; then
          echo "Missing Azure auth secrets. Set AZURE_CREDENTIALS or set AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID."
          exit 1
        fi
        az ml workspace show -g "$RG" -n "$WS" --query name -o tsv >/dev/null
        if ! az ml compute show -g "$RG" -w "$WS" -n "$COMPUTE_NAME" --query name -o tsv >/dev/null; then
          echo "Compute '$COMPUTE_NAME' was not found in workspace '$WS'."
          echo "Available computes:"
          az ml compute list -g "$RG" -w "$WS" --query "[].name" -o tsv || true
          echo "Set repository variable AZURE_ML_COMPUTE to an existing compute, or run the Lab 11 setup script to create course-cpu."
          exit 1
        fi
        echo "RG=$RG" >> "$GITHUB_ENV"
        echo "WS=$WS" >> "$GITHUB_ENV"
        echo "COMPUTE_NAME=$COMPUTE_NAME" >> "$GITHUB_ENV"
    - name: Run Azure Machine Learning training job
      run: |
        set -euo pipefail
        az ml job create -f 11-Automate-Model-Training-GitHub-Actions/jobs/train-job.yml --stream --resource-group "$RG" --workspace-name "$WS" --set compute="azureml:$COMPUTE_NAME"

