name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Azure login (service principal secret)
      if: ${{ secrets.AZURE_CREDENTIALS != '' }}
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Azure login (OIDC)
      if: ${{ secrets.AZURE_CREDENTIALS == '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Validate Azure ML configuration
      env:
        RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        WS: ${{ vars.AZURE_WORKSPACE_NAME || vars.AZURE_ML_WORKSPACE }}
        HAS_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS != '' }}
        HAS_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
        HAS_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
        HAS_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}
      run: |
        set -euo pipefail
        if [ -z "$RG" ]; then
          echo "Missing repository variable: AZURE_RESOURCE_GROUP"
          exit 1
        fi
        if [ -z "$WS" ]; then
          echo "Missing repository variable: AZURE_WORKSPACE_NAME (or AZURE_ML_WORKSPACE)"
          exit 1
        fi
        if [ "$HAS_CREDENTIALS" != "true" ] && { [ "$HAS_CLIENT_ID" != "true" ] || [ "$HAS_TENANT_ID" != "true" ] || [ "$HAS_SUBSCRIPTION_ID" != "true" ]; }; then
          echo "Missing Azure auth secrets. Set AZURE_CREDENTIALS or set AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID."
          exit 1
        fi
    - name: Run Azure Machine Learning training job
      env:
        RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        WS: ${{ vars.AZURE_WORKSPACE_NAME || vars.AZURE_ML_WORKSPACE }}
      run: az ml job create -f 11-Automate-Model-Training-GitHub-Actions/jobs/train-job.yml --stream --resource-group "$RG" --workspace-name "$WS"

