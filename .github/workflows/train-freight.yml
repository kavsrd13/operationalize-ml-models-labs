name: Train freight model in Azure ML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '11-Automate-Model-Training-GitHub-Actions/jobs/train-job.yml'
      - '11-Automate-Model-Training-GitHub-Actions/src/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: freight-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    # The initial publication cannot accidentally submit a billable job.
    if: vars.ENABLE_AZURE_TRAINING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML CLI extension
        run: az extension add --name ml --yes

      - name: Check shared course resources
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          WS: ${{ vars.AZURE_ML_WORKSPACE }}
          COMPUTE: ${{ vars.AZURE_ML_COMPUTE }}
        run: |
          set -euo pipefail
          trim_value() {
            local value="${1:-}"
            value="${value//$'\r'/}"
            value="${value//$'\n'/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          RG="$(trim_value "${RG:-}")"
          WS="$(trim_value "${WS:-}")"
          COMPUTE_NAME="$(trim_value "${COMPUTE:-course-cpu}")"
          if [ -z "$RG" ] || [ -z "$WS" ]; then
            echo "Missing AZURE_RESOURCE_GROUP or AZURE_ML_WORKSPACE repository variable."
            exit 1
          fi
          az ml workspace show -g "$RG" -n "$WS" --query '{name:name,location:location}' -o json
          if ! az ml compute show -g "$RG" -w "$WS" -n "$COMPUTE_NAME" --query name -o tsv >/dev/null; then
            echo "Compute '$COMPUTE_NAME' was not found in workspace '$WS'."
            echo "Available computes:"
            az ml compute list -g "$RG" -w "$WS" --query "[].name" -o tsv || true
            echo "Set repository variable AZURE_ML_COMPUTE to an existing compute, or run the Lab 11 setup script to create course-cpu."
            exit 1
          fi
          az ml compute show -g "$RG" -w "$WS" -n "$COMPUTE_NAME" --query '{name:name,type:type,size:size,min:min_instances,max:max_instances}' -o json
          az ml data show -g "$RG" -w "$WS" -n olist-ecommerce-raw -v 1 --query '{name:name,version:version,type:type,path:path}' -o json
          echo "RG=$RG" >> "$GITHUB_ENV"
          echo "WS=$WS" >> "$GITHUB_ENV"
          echo "COMPUTE_NAME=$COMPUTE_NAME" >> "$GITHUB_ENV"

      - name: Submit training and check result
        run: |
          set -euo pipefail
          JOB_NAME=$(az ml job create \
            --file 11-Automate-Model-Training-GitHub-Actions/jobs/train-job.yml \
            -g "$RG" -w "$WS" \
            --set compute="azureml:$COMPUTE_NAME" \
            --set environment_variables.TRAINING_GIT_SHA="$GITHUB_SHA" \
                  environment_variables.TRAINING_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                  tags.git_commit="$GITHUB_SHA" --query name -o tsv)
          echo "Azure ML job: $JOB_NAME"
          STUDIO_URL=$(az ml job show -n "$JOB_NAME" -g "$RG" -w "$WS" --query services.Studio.endpoint -o tsv)
          echo "### Azure ML training" >> "$GITHUB_STEP_SUMMARY"
          echo "Job: \`$JOB_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Data: \`olist-ecommerce-raw:1\` (read-only mount)" >> "$GITHUB_STEP_SUMMARY"
          echo "Compute: \`$COMPUTE_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open training in Azure ML Studio]($STUDIO_URL)" >> "$GITHUB_STEP_SUMMARY"
          # Poll Azure ML directly. Some CLI versions fail while streaming logs
          # even when the cloud job itself completes successfully.
          for attempt in {1..120}; do
            STATUS=$(az ml job show -n "$JOB_NAME" -g "$RG" -w "$WS" --query status -o tsv)
            echo "Azure ML status: $STATUS"
            case "$STATUS" in
              Completed)
                echo "Status: Completed" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              Failed|Canceled|Cancelled|NotResponding)
                echo "Status: $STATUS" >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Status: timed out waiting for Azure ML" >> "$GITHUB_STEP_SUMMARY"
          exit 1
